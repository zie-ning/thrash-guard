<svg xmlns="http://www.w3.org/2000/svg" viewBox="-110 0 930 560" width="930" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR','NanumGothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="-110" width="930" height="560" fill="#ffffff"/>

  <!-- 1. 평소 -->
  <rect x="110" y="20" width="320" height="56" rx="10" fill="#eef2f7" stroke="#8a97a8"/>
  <text x="270" y="45" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">평소: poll로 대기</text>
  <text x="270" y="64" text-anchor="middle" font-size="13" fill="#444">CPU를 쓰지 않고 잠들어 있다</text>

  <line x1="270" y1="76" x2="270" y2="108" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 2. 트리거 -->
  <rect x="110" y="110" width="320" height="64" rx="10" fill="#fff4e0" stroke="#d9a441"/>
  <text x="270" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">커널의 PSI 트리거가 데몬을 깨운다</text>
  <text x="270" y="156" text-anchor="middle" font-size="13" fill="#444">memory PSI가 1초 중 150 ms(15%) 이상</text>

  <line x1="270" y1="174" x2="270" y2="206" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 3. 관찰 -->
  <rect x="110" y="208" width="320" height="64" rx="10" fill="#e8f1fb" stroke="#5b8fc7"/>
  <text x="270" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">관찰 시작</text>
  <text x="270" y="254" text-anchor="middle" font-size="13" fill="#444">250 ms마다 PSI와 가용 메모리를 읽는다</text>

  <line x1="270" y1="272" x2="270" y2="304" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 4. 판단 -->
  <rect x="60" y="306" width="420" height="124" rx="10" fill="#f3ecf9" stroke="#9a7bbd"/>
  <text x="270" y="332" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">최근 10초 평균으로 판단: 둘 중 하나라도 충족?</text>
  <text x="270" y="364" text-anchor="middle" font-size="13" fill="#333">memory 경로: memory PSI 10% 이상 + 가용 메모리 10% 이하</text>
  <text x="270" y="390" text-anchor="middle" font-size="13" fill="#333">io 경로: IO PSI 50% 이상 + 가용 메모리 5% 이하</text>

  <!-- 충족: 오른쪽 -->
  <line x1="480" y1="368" x2="552" y2="368" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="516" y="358" text-anchor="middle" font-size="13" fill="#222">충족</text>

  <rect x="554" y="340" width="230" height="56" rx="10" fill="#fde8e8" stroke="#d27a7a"/>
  <text x="669" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">종료할 프로세스 선택</text>

  <!-- 충족 안 함: 아래 -->
  <line x1="270" y1="430" x2="270" y2="468" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="282" y="454" font-size="13" fill="#222">충족 안 함</text>

  <rect x="110" y="470" width="320" height="64" rx="10" fill="#e9f5ea" stroke="#7fb287"/>
  <text x="270" y="496" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">관찰을 계속한다</text>
  <text x="270" y="516" text-anchor="middle" font-size="13" fill="#444">두 평균이 모두 낮아지면 관찰을 끝낸다</text>

  <!-- 관찰 끝: 평소로 복귀 (왼쪽 우회) -->
  <path d="M 110 502 L 36 502 L 36 48 L 108 48" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="-34" y="272" font-size="13" fill="#222" text-anchor="middle">압력이 가라앉으면</text>
  <text x="-34" y="292" font-size="13" fill="#222" text-anchor="middle">다시 대기</text>
</svg>
