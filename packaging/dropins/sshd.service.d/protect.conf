# thrash-guard 보호 설정 예시: sshd
#
# 설치: /etc/systemd/system/sshd.service.d/protect.conf 로 복사한 뒤 `systemctl daemon-reload` 후 sshd를 재시작한다.
# (Debian·Ubuntu에서는 서비스 이름이 ssh.service이므로 ssh.service.d 아래에 둔다.)
# 효과는 가설이며 VM 실험에서 확인한다(docs/design/protection.md).

[Service]
# 종료 보호: 이 값이 -1000인 프로세스가 든 cgroup을 thrash-guard가 종료 후보에서 뺀다.
# 커널 OOM killer도 -1000인 프로세스는 고르지 않는다.
OOMScoreAdjust=-1000

# 회수 보호(권고): 스래싱 중 이 서비스의 메모리가 디스크로 쫓겨나지 않게 한다.
# 서비스가 실제로 쓰는 메모리를 잰 뒤 값을 정한다. 1 GiB 같은 작은 서버에서는 크게 잡을수록
# 다른 프로세스가 쓸 메모리를 깎으므로 켜기 전에 확인한다.
#MemoryLow=16M
