# thrash-guard 보호 설정 예시: sshd
#
# 설치(Ubuntu·Debian은 서비스 이름이 ssh.service, RHEL 계열은 sshd.service):
#   sudo mkdir -p /etc/systemd/system/ssh.service.d
#   sudo cp protect.conf /etc/systemd/system/ssh.service.d/protect.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart ssh
#   systemctl show ssh -p OOMScoreAdjust      # 적용 확인
# 이 드롭인을 직접 설치해서 확인하는 절차는 아직 VM에서 시험하지 않았다(미확인).

[Service]
# 종료 보호(권장): 이 값이 -1000인 프로세스가 든 cgroup을 thrash-guard가 종료 후보에서 뺀다.
# 커널 OOM killer도 -1000인 프로세스는 고르지 않는다. VM 실험에서 보호된 컨테이너가 후보에서
# 제외되어 살아남는 것을 확인했다(docs/design/protection.md 3.4절).
OOMScoreAdjust=-1000

# 회수 보호(선택, 기본은 끔): 스래싱 중 이 서비스의 메모리가 디스크로 쫓겨나지 않게 하려는 시도다.
# VM 실험(swap 없음, 익명 메모리가 가득한 스래싱)에서는 ssh.service, system.slice, user.slice에
# 각 32M을 걸어도 SSH 로그인이 막히는 시간이 줄지 않았다(docs/design/protection.md 2.2절).
# systemd는 이 값을 부모 slice로 올려 주지 않으므로 쓰려면 system.slice, user.slice까지 직접 설정해야 한다.
# 효과가 입증되지 않았으므로 필요할 때만 켜고, 서비스가 실제로 쓰는 메모리를 잰 뒤 값을 정한다.
#MemoryLow=32M
