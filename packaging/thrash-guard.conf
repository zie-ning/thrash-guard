# thrash-guard 설정 예시 (key=value). 지운 줄은 기본값을 쓴다.
# dry-run/실제 종료는 설정 파일이 아니라 실행 옵션(--dry-run, --no-dry-run)으로 정한다.
# 기본값과 의미는 docs/design/overview.md 3절과 4절을 본다.

# 종료 후보: target_parent 바로 아래 cgroup 중 target_match 이름에 맞는 것만 종료할 수 있다.
# 기본은 컨테이너 런타임의 cgroup 이름이다. 일반 서비스를 후보로 쓰려면 이름을 적는다.
#target_parent = /sys/fs/cgroup/system.slice
#target_match  = docker-*.scope,libpod-*.scope,cri-containerd-*.scope,crio-*.scope

# 판단: 최근 sustain_sec초 평균 PSI full이 full_pct 이상이고 MemAvailable이 mem_avail_pct 이하일 때.
#full_pct = 10
#sustain_sec = 10
#mem_avail_pct = 10

# 안전장치
#startup_grace_sec = 30
#cooldown_sec = 60
#max_kills_per_hour = 3

# 로그: 비워 두면 표준 오류(systemd 아래에서는 journald)다.
#log_path =
